<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sinyal</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
    }
    a { color: #fff; }
  </style>
</head>
<body>
  <main>
    <p>Sinyal açılıyor.</p>
    <p><a id="open" href="sinyal://reset">Uygulamayı aç</a></p>
  </main>
  <script>
    var extra = location.hash.length > 1 ? location.hash.slice(1) : "";
    var search = location.search.length > 1 ? location.search.slice(1) : "";
    var combined = [search, extra].filter(Boolean).join("&");
    var next = "sinyal://reset" + (combined ? "?" + combined : "");
    document.getElementById("open").href = next;
    location.replace(next);
  </script>
</body>
</html>
